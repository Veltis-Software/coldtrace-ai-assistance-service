spring.application.name=coldtrace-ai-assistance-service
server.port=${PORT:8087}
spring.messages.basename=messages
coldtrace.identity.url=${IDENTITY_URL:http://localhost:8081}
coldtrace.asset.url=${ASSET_URL:http://localhost:8082}
coldtrace.internal.service-key=${INTERNAL_SERVICE_KEY}
management.endpoints.web.exposure.include=health,info

coldtrace.subscription.url=${SUBSCRIPTION_URL:http://localhost:8088}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Correlation-Id
cors.exposed-headers=X-Correlation-Id,Location
cors.max-age=3600
coldtrace.alert.url=${ALERT_URL:http://localhost:8084}
coldtrace.monitoring.url=${MONITORING_URL:http://localhost:8083}
coldtrace.maintenance.url=${MAINTENANCE_URL:http://localhost:8086}
coldtrace.report.url=${REPORT_URL:http://localhost:8085}
coldtrace.ai.enabled=${AI_ASSISTANCE_ENABLED:false}
coldtrace.ai.provider=${AI_MODEL_PROVIDER:ollama}
coldtrace.ai.model-name=${AI_MODEL_NAME:gemma3:4b}
coldtrace.ai.timeout=${AI_REQUEST_TIMEOUT:30s}
spring.ai.model.chat=${AI_MODEL_PROVIDER:none}
spring.ai.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
spring.ai.retry.backoff.initial-interval=${AI_RETRY_INITIAL_INTERVAL:1s}
spring.ai.retry.backoff.max-interval=${AI_RETRY_MAX_INTERVAL:5s}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${AI_MODEL_NAME:gemma3:4b}
spring.ai.ollama.chat.format=${OLLAMA_CHAT_FORMAT:json}
spring.ai.ollama.chat.temperature=${AI_TEMPERATURE:0.2}
spring.ai.ollama.chat.num-ctx=${OLLAMA_NUM_CTX:8192}
spring.ai.ollama.chat.num-predict=${OLLAMA_NUM_PREDICT:2000}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${AI_MODEL_NAME:gpt-5.4-mini}
